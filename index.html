<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Seempay+ — Cinema & Streaming</title>

  <meta
    name="description"
    content="Seempay+ — премиальная стриминговая и киноплатформа."
  />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            purple: {
              450: "#a855f7",
              550: "#9333ea"
            }
          },
          boxShadow: {
            glow: "0 0 40px rgba(168,85,247,.18)",
            "glow-lg": "0 0 80px rgba(168,85,247,.25)"
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- =========================================================
       BACKGROUND
  ========================================================== -->

  <div class="ambient ambient-1"></div>
  <div class="ambient ambient-2"></div>
  <div class="noise"></div>


  <!-- =========================================================
       APP
  ========================================================== -->

  <div id="app" class="min-h-screen">

    <!-- =======================================================
         DESKTOP NAVIGATION
    ======================================================== -->

    <header class="topbar">

      <div class="topbar-inner">

        <button
          class="brand"
          onclick="navigate('trending')"
          aria-label="Seempay+"
        >
          <span class="brand-mark">
            <span></span>
          </span>

          <span class="brand-text">
            Seempay<span>+</span>
          </span>
        </button>


        <nav class="desktop-nav">

          <button
            class="nav-link active"
            data-page="trending"
            onclick="navigate('trending')"
          >
            <i data-lucide="flame"></i>
            <span>В тренде</span>
          </button>

          <button
            class="nav-link"
            data-page="releases"
            onclick="navigate('releases')"
          >
            <i data-lucide="calendar-days"></i>
            <span>Релизы</span>
          </button>

          <button
            class="nav-link"
            data-page="profile"
            onclick="navigate('profile')"
          >
            <i data-lucide="user-round"></i>
            <span>Профиль</span>
          </button>

        </nav>


        <div class="header-actions">

          <button
            class="icon-button"
            onclick="openSearch()"
            title="Поиск"
          >
            <i data-lucide="search"></i>
          </button>

          <button
            id="headerProfileButton"
            class="profile-mini"
            onclick="navigate('profile')"
          >
            <span id="headerAvatar">S</span>
          </button>

        </div>

      </div>

    </header>


    <!-- =======================================================
         MAIN
    ======================================================== -->

    <main id="mainContent" class="page-container">

      <!-- PAGE CONTENT GENERATED BY JS -->

    </main>


    <!-- =======================================================
         MOBILE NAVIGATION
    ======================================================== -->

    <nav class="mobile-nav">

      <button
        class="mobile-nav-item active"
        data-page="trending"
        onclick="navigate('trending')"
      >
        <i data-lucide="flame"></i>
        <span>Тренды</span>
      </button>

      <button
        class="mobile-nav-item"
        data-page="releases"
        onclick="navigate('releases')"
      >
        <i data-lucide="calendar-days"></i>
        <span>Релизы</span>
      </button>

      <button
        class="mobile-nav-item"
        data-page="profile"
        onclick="navigate('profile')"
      >
        <i data-lucide="user-round"></i>
        <span>Профиль</span>
      </button>

    </nav>

  </div>


  <!-- =========================================================
       SEARCH MODAL
  ========================================================== -->

  <div id="searchModal" class="modal hidden">

    <div
      class="modal-backdrop"
      onclick="closeSearch()"
    ></div>

    <div class="search-modal">

      <div class="search-header">

        <div class="search-input-wrapper">

          <i data-lucide="search"></i>

          <input
            id="searchInput"
            type="text"
            placeholder="Найти фильм, сериал..."
            autocomplete="off"
            oninput="performSearch()"
          />

        </div>

        <button
          class="icon-button"
          onclick="closeSearch()"
        >
          <i data-lucide="x"></i>
        </button>

      </div>

      <div id="searchResults" class="search-results">
        <div class="empty-search">
          Начните вводить название
        </div>
      </div>

    </div>

  </div>


  <!-- =========================================================
       AUTH MODAL
  ========================================================== -->

  <div id="authModal" class="modal hidden">

    <div
      class="modal-backdrop"
      onclick="closeAuth()"
    ></div>

    <div class="auth-modal glass-card">

      <button
        class="modal-close"
        onclick="closeAuth()"
      >
        <i data-lucide="x"></i>
      </button>

      <div class="auth-logo">
        <span class="brand-mark">
          <span></span>
        </span>
      </div>

      <h2>Войти в Seempay+</h2>

      <p>
        Сохраняйте фильмы, управляйте подпиской
        и получайте доступ к персональным функциям.
      </p>

      <form onsubmit="handleLogin(event)">

        <label>
          Email
          <input
            id="authEmail"
            type="email"
            required
            placeholder="you@example.com"
          />
        </label>

        <button class="primary-button full-width">
          Продолжить
          <i data-lucide="arrow-right"></i>
        </button>

      </form>

      <div class="auth-note">
        <i data-lucide="shield-check"></i>
        <span>
          Для демонстрации пароль не требуется.
        </span>
      </div>

    </div>

  </div>


  <!-- =========================================================
       MOVIE MODAL
  ========================================================== -->

  <div id="movieModal" class="modal hidden">

    <div
      class="modal-backdrop"
      onclick="closeMovie()"
    ></div>

    <div class="movie-modal">

      <button
        class="modal-close"
        onclick="closeMovie()"
      >
        <i data-lucide="x"></i>
      </button>

      <div id="movieModalContent"></div>

    </div>

  </div>


  <!-- =========================================================
       TOAST
  ========================================================== -->

  <div id="toastContainer" class="toast-container"></div>


  <!-- =========================================================
       JS
  ========================================================== -->

  <script src="script.js"></script>

</body>
</html>
